title: "[Idea]: "
labels: ["idea", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Share Your Idea
        
        Your ideas help shape the ScrollSoul Empire! Describe your vision below.

  - type: textarea
    id: idea
    attributes:
      label: 💡 The Idea
      description: What would you like to see added or improved?
      placeholder: "I'd love to see ScrollSoul support..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 🎯 Why It Matters
      description: How would this benefit the community?
      placeholder: "This would help music licensors because..."
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 🔗 Examples or References
      description: Links or examples of similar features elsewhere
      placeholder: "Similar to how Spotify does..."
